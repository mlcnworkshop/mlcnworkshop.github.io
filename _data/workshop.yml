# Short questions and answers: shown on the home page and given to search engines / AI search.
faq:
  - q: What is MLCN?
    a: MLCN (Machine Learning in Clinical Neuroimaging) is an international workshop held with the MICCAI conference since 2018. It brings together researchers in machine learning, neuroscience and clinicians to develop methods for neuroimaging data and translate them into clinical practice.
  - q: When and where is MLCN 2027?
    a: MLCN 2027 takes place at MICCAI 2027 in Auckland, New Zealand. MICCAI runs from 27 September to 1 October 2027; the exact workshop day will be announced.
  - q: How do I submit a paper to MLCN?
    a: Papers are submitted through OpenReview. They must be original, in Springer LNCS format, at most 8 pages plus up to 2 pages of references, and anonymous for double-blind review.
  - q: Where are MLCN papers published?
    a: Accepted papers are published in the MLCN proceedings in Springer Lecture Notes in Computer Science, alongside MICCAI.
