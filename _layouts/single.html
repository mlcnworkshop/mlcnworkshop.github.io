---
layout: default
---
{% include base_path %}
<div id="main" role="main">
  <article class="page">
    <div class="page__inner-wrap">
      {% if page.title and page.hide_title != true %}<header><h1 class="page__title">{{ page.title }}</h1></header>{% endif %}
      <section class="page__content">
        {{ content }}
      </section>
    </div>
  </article>
</div>
