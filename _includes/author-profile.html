{% include base_path %}
{% assign author = site.author %}
<div>
  <div class="author__avatar">
    <img src="{{ author.avatar | prepend: "/images/" | prepend: base_path }}" class="author__avatar" alt="MLCN logo">
  </div>
  <div class="author__urls-wrapper">
    <ul class="author__urls social-icons">
      {% if author.location %}<li><i class="fa fa-fw fa-map-marker" aria-hidden="true"></i> {{ author.location }}</li>{% endif %}
      {% if author.youtube %}<li><a href="{{ author.youtube }}"><i class="fab fa-fw fa-youtube" aria-hidden="true"></i> YouTube</a></li>{% endif %}
    </ul>
  </div>
</div>
