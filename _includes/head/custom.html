{% include base_path %}
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
{% assign w = site.data.workshop %}
<meta property="og:image" content="{{ site.url }}/images/{{ site.og_image }}">
<meta property="og:image:alt" content="Auckland skyline, venue city of MICCAI {{ w.year }} and MLCN {{ w.year }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ site.url }}/images/{{ site.og_image }}">
<meta name="robots" content="index, follow, max-image-preview:large">
{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ site.url }}/#org",
      "name": "MLCN – Machine Learning in Clinical Neuroimaging",
      "alternateName": "MLCN",
      "url": "{{ site.url }}/",
      "logo": "{{ site.url }}/images/MLCN_logo_blue.png",
      "sameAs": ["{{ w.proceedings }}", "{{ w.youtube }}"]
    },
    {
      "@type": "Event",
      "name": "MLCN {{ w.year }}: Machine Learning in Clinical Neuroimaging",
      "alternateName": "MLCN {{ w.year }}",
      "description": "International workshop on machine learning methods for clinical neuroimaging and their translation to clinical practice, held at MICCAI {{ w.year }}.",
      "url": "{{ site.url }}/",
      "image": "{{ site.url }}/images/{{ site.og_image }}",
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      {% if w.workshop_start != "" %}"startDate": "{{ w.workshop_start }}",{% else %}"startDate": "{{ w.conference_start }}",
      "endDate": "{{ w.conference_end }}",{% endif %}
      "location": { "@type": "Place", "name": "MICCAI {{ w.year }}", "address": { "@type": "PostalAddress", "addressLocality": "{{ w.city | split: ',' | first }}", "addressCountry": "{{ w.country_code }}" } },
      "organizer": { "@id": "{{ site.url }}/#org" },
      "superEvent": { "@type": "Event", "name": "MICCAI {{ w.year }}", "url": "https://conferences.miccai.org/" }
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
        {% for q in w.faq %}{ "@type": "Question", "name": {{ q.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ q.a | jsonify }} } }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }
  ]
}
</script>
{% endif %}
