# Site-wide settings (rarely change). Yearly workshop info lives in _data/workshop.yml.
# Restart `jekyll serve` after editing this file.

locale          : "en-US"
title           : "MLCN"
title_separator : "-"
name            : "MLCN"
description     : "MLCN (Machine Learning in Clinical Neuroimaging) is an international MICCAI workshop on machine learning methods for neuroimaging and their translation to clinical practice. MLCN 2027 takes place at MICCAI 2027 in Auckland, New Zealand."
url             : "https://mlcnworkshop.github.io"
baseurl         : ""
repository      : "mlcnworkshop.github.io"
breadcrumbs     : false
future          : true
og_image        : "auckland.jpg"            # social preview image (in /images)
google_site_verification :                 # paste the Google Search Console code here

# Sidebar
author:
  avatar        : "MLCN_logo_blue.png"
  location      : "MICCAI 2027 · Auckland, New Zealand"
  youtube       : "https://www.youtube.com/channel/UC7RKhS5bHKiuYXdaBolX6Og"

include:
  - _pages
  - files
  - robots.txt
  - llms.txt
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
encoding        : "utf-8"
markdown        : kramdown
highlighter     : rouge
kramdown:
  input         : GFM
  auto_ids      : true
  smart_quotes  : lsquo,rsquo,ldquo,rdquo

defaults:
  - scope: { path: "", type: pages }
    values: { layout: single, author_profile: true }

sass:
  sass_dir      : _sass
  style         : compressed

permalink       : /:categories/:title/
timezone        : Europe/Berlin

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings     : all
  ignore:
    envs        : development
